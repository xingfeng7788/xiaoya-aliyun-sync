<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小雅资源助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen text-gray-700">

    <!-- Navbar -->
    <nav class="sticky top-0 z-40 glass-effect border-b border-gray-200 shadow-sm transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-2 rounded-lg shadow-md">
                        <i class="fas fa-film text-lg"></i>
                    </div>
                    <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-700 to-purple-700">
                        小雅资源助手
                    </span>
                </div>
                <button onclick="openModal()" class="group flex items-center gap-2 bg-white border border-gray-200 text-gray-600 px-4 py-2 rounded-full hover:border-blue-400 hover:text-blue-600 hover:shadow-md transition-all duration-300">
                    <div class="bg-blue-100 text-blue-600 rounded-full p-1.5 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                        <i class="fas fa-cloud"></i>
                    </div>
                    <span class="text-sm font-medium">阿里云盘管理</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <!-- Search Section -->
        <div class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-gray-900 mb-4 tracking-tight">
                探索海量影视资源
            </h1>
            <p class="text-lg text-gray-500 mb-8">一键搜索，极速转存，畅享高清体验</p>
            
            <div class="relative max-w-2xl mx-auto group">
                <!-- Removed the glow effect div -->
                <div class="relative flex bg-white rounded-xl shadow-xl overflow-hidden ring-1 ring-gray-900/5">
                    <div class="pl-6 flex items-center pointer-events-none text-gray-400 group-focus-within:text-blue-500 transition-colors duration-300">
                        <i class="fas fa-search text-lg"></i>
                    </div>
                    <input type="text" id="keyword" 
                           class="flex-1 border-0 py-4 pl-4 pr-4 text-gray-900 placeholder-gray-400 focus:ring-0 outline-none text-lg transition-colors"
                           placeholder="输入电影、剧集名称...">
                    <button onclick="search()" id="searchBtn" 
                            class="bg-blue-600 text-white px-8 font-semibold hover:bg-blue-700 transition-colors duration-200 flex items-center gap-2">
                        <span>搜索</span>
                        <i class="fas fa-arrow-right text-sm"></i>
                    </button>
                </div>

                <!-- Search History -->
                <div id="search-history" class="mt-6 hidden transition-all duration-300">
                    <div class="flex flex-col items-center gap-2">
                        <div class="text-sm text-gray-400 mb-1">最近搜索</div>
                        <div class="flex flex-wrap justify-center gap-2" id="history-tags">
                            <!-- Tags will be injected here -->
                        </div>
                        <button onclick="clearHistory()" class="text-xs text-gray-300 hover:text-red-400 mt-2 transition-colors flex items-center gap-1" title="清空历史">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div id="loading" class="hidden py-12 text-center">
            <div class="inline-flex items-center gap-3 px-4 py-2 rounded-full bg-blue-50 text-blue-700">
                <i class="fas fa-circle-notch fa-spin"></i>
                <span class="font-medium">正在全网搜寻资源...</span>
            </div>
        </div>

        <div id="results-container" class="hidden">
            <div class="flex items-center justify-between mb-4 px-2">
                <h3 class="text-lg font-bold text-gray-800">搜索结果</h3>
                <span class="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full" id="resultCount">0 个资源</span>
            </div>
            <ul id="results" class="bg-white rounded-2xl shadow-sm border border-gray-100 divide-y divide-gray-100 overflow-hidden">
                <!-- Results will be injected here -->
            </ul>
        </div>
        
        <!-- Empty State -->
        <div id="empty-state" class="text-center py-16 opacity-60">
            <div class="bg-gray-100 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-400 text-3xl">
                <i class="fas fa-film"></i>
            </div>
            <p class="text-gray-500">输入关键词开始搜索</p>
        </div>
    </main>

    <!-- Aliyun Drive Modal -->
    <div id="aliModal" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <!-- Backdrop -->
        <div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity opacity-0" id="modalBackdrop"></div>

        <div class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
                <!-- Modal Panel -->
                <div class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-4xl opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" id="modalPanel">
                    
                    <!-- Header -->
                    <div class="bg-gradient-to-r from-gray-50 to-white px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="bg-blue-100 p-2 rounded-lg text-blue-600">
                                <i class="fas fa-cloud"></i>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-gray-900" id="modal-title">阿里云盘文件管理</h3>
                                <p class="text-xs text-gray-500 truncate max-w-md" id="currentPath">加载中...</p>
                            </div>
                        </div>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full p-2 transition-colors">
                            <i class="fas fa-times text-xl"></i>
                        </button>
                    </div>

                    <!-- Toolbar -->
                    <div class="px-6 py-3 bg-white border-b border-gray-100 flex flex-wrap items-center gap-2">
                        <button onclick="loadAliFiles('root')" class="inline-flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                            <i class="fas fa-home text-gray-500"></i>
                        </button>
                        <button onclick="goUp()" id="btnUp" class="hidden inline-flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                            <i class="fas fa-level-up-alt text-gray-500"></i>
                        </button>
                        
                        <div class="h-6 w-px bg-gray-300 mx-1"></div>

                        <button onclick="createFolder()" class="inline-flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                            <i class="fas fa-folder-plus text-yellow-500"></i> 新建文件夹
                        </button>
                        
                        <button onclick="triggerUpload()" class="inline-flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                            <i class="fas fa-cloud-upload-alt text-blue-500"></i> 上传文件
                        </button>
                        <input type="file" id="uploadInput" style="display:none" onchange="handleFileUpload(this)">

                        <button onclick="deleteSelected()" class="inline-flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-red-600 bg-white border border-red-200 rounded-lg hover:bg-red-50 transition-colors">
                            <i class="fas fa-trash-alt"></i> 删除选中
                        </button>

                        <div class="flex-1"></div>
                        
                        <button onclick="downloadSelected()" class="inline-flex items-center gap-2 px-4 py-1.5 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 shadow-sm transition-colors">
                            <i class="fas fa-download"></i> 下载到服务器
                        </button>
                    </div>

                    <!-- File List -->
                    <div class="px-6 py-2 bg-gray-50 min-h-[400px] max-h-[60vh] overflow-y-auto">
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                            <table class="min-w-full divide-y divide-gray-100">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-4 py-3 text-left w-12">
                                            <input type="checkbox" onchange="toggleAll(this)" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500 w-4 h-4 cursor-pointer">
                                        </th>
                                        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">文件名</th>
                                        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider w-28">大小</th>
                                        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider w-36">修改时间</th>
                                    </tr>
                                </thead>
                                <tbody id="aliFiles" class="divide-y divide-gray-50 text-sm">
                                    <!-- Files injected via JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <!-- Footer -->
                    <div class="bg-gray-50 px-6 py-3 text-right">
                        <span class="text-xs text-gray-400">支持多选批量下载 • 点击文件名直接浏览器下载</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Modal Logic
        const modal = document.getElementById('aliModal');
        const modalBackdrop = document.getElementById('modalBackdrop');
        const modalPanel = document.getElementById('modalPanel');

        function openModal() {
            modal.classList.remove('hidden');
            // Allow display:block to apply before adding opacity classes for transition
            setTimeout(() => {
                modalBackdrop.classList.remove('opacity-0');
                modalPanel.classList.remove('opacity-0', 'translate-y-4', 'sm:translate-y-0', 'sm:scale-95');
            }, 10);
            
            if (document.getElementById('aliFiles').children.length <= 1) {
                loadAliFiles('root');
            }
        }

        function closeModal() {
            modalBackdrop.classList.add('opacity-0');
            modalPanel.classList.add('opacity-0', 'translate-y-4', 'sm:translate-y-0', 'sm:scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // Close modal when clicking outside
        modal.addEventListener('click', (e) => {
            if (e.target === modalBackdrop || e.target.closest('.fixed.inset-0') === e.target) {
                // closeModal(); // Optional: enable click outside to close
            }
        });

        document.getElementById('keyword').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                search();
            }
        });

        // Search Functionality
        async function search() {
            const keyword = document.getElementById('keyword').value;
            if (!keyword) return alert('请输入关键词');

            // Save to history
            saveSearchHistory(keyword);

            const btn = document.getElementById('searchBtn');
            const list = document.getElementById('results');
            const loading = document.getElementById('loading');
            const container = document.getElementById('results-container');
            const emptyState = document.getElementById('empty-state');
            const resultCount = document.getElementById('resultCount');

            list.innerHTML = '';
            loading.classList.remove('hidden');
            container.classList.add('hidden');
            emptyState.classList.add('hidden');
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            try {
                const res = await fetch('/api/search', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({keyword})
                });
                const data = await res.json();

                if (data.status === 'success') {
                    window.currentResults = data.results;
                    resultCount.textContent = `${data.results.length} 个资源`;
                    
                    if (data.results.length > 0) {
                        data.results.forEach((item, index) => {
                            const li = document.createElement('li');
                            li.className = 'p-4 hover:bg-gray-50 transition-colors duration-150 group';
                            li.innerHTML = `
                                <div class="flex items-center justify-between gap-4">
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-center gap-2 mb-1">
                                            <i class="fas fa-file-video text-blue-500 opacity-75 group-hover:opacity-100"></i>
                                            <p class="text-sm font-medium text-gray-900 truncate" title="${item.name}">${item.name}</p>
                                        </div>
                                        <a href="${item.url}" target="_blank" class="text-xs text-gray-400 hover:text-blue-500 hover:underline truncate block flex items-center gap-1" title="跳转到小雅">
                                            <i class="fas fa-external-link-alt text-[10px]"></i>
                                            ${item.path}
                                        </a>
                                    </div>
                                    <button onclick="transferByIndex(${index})" class="flex-shrink-0 inline-flex items-center gap-1 bg-white border border-gray-200 text-gray-600 text-xs px-3 py-1.5 rounded-lg hover:border-green-500 hover:text-green-600 hover:shadow-sm transition-all duration-200">
                                        <i class="fas fa-save"></i>
                                        <span>一键转存</span>
                                    </button>
                                </div>
                            `;
                            list.appendChild(li);
                        });
                        container.classList.remove('hidden');
                    } else {
                        emptyState.innerHTML = '<p class="text-gray-500">未找到相关资源，换个词试试？</p>';
                        emptyState.classList.remove('hidden');
                    }
                } else {
                    alert('搜索失败: ' + data.message);
                }
            } catch (error) {
                alert('请求出错，请检查网络');
            } finally {
                loading.classList.add('hidden');
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }

        async function transferByIndex(index) {
            const item = window.currentResults[index];
            if (!item) return;
            
            const buttons = document.querySelectorAll('button');
            // Find the specific button clicked based on logic (simplified here for brevity)
            // A more robust way would be to pass `this` to the function
            const allTransferBtns = Array.from(document.querySelectorAll('button')).filter(b => b.textContent.includes('一键转存'));
            const targetBtn = allTransferBtns[index]; // Assuming order matches

            if (targetBtn) {
                const originalHtml = targetBtn.innerHTML;
                targetBtn.disabled = true;
                targetBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 转存中...';
                targetBtn.classList.add('bg-gray-100', 'text-gray-400');
                
                try {
                    const res = await fetch('/api/transfer', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({path: item.path})
                    });
                    const data = await res.json();
                    alert(data.message);
                } catch (e) {
                    alert('请求失败');
                } finally {
                    targetBtn.disabled = false;
                    targetBtn.innerHTML = originalHtml;
                    targetBtn.classList.remove('bg-gray-100', 'text-gray-400');
                }
            }
        }

        // Aliyun Drive Logic
        let currentDriveId = null;
        let currentParentId = 'root';
        let parentHistory = [];
        
        async function loadAliFiles(parentId, isUp = false) {
            const tbody = document.getElementById('aliFiles');
            tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-12 text-center text-gray-400"><i class="fas fa-circle-notch fa-spin text-2xl mb-2"></i><br>加载文件中...</td></tr>';
            
            try {
                const res = await fetch('/api/aliyun/files', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        parent_file_id: parentId,
                        drive_id: currentDriveId
                    })
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    currentDriveId = data.drive_id;
                    
                    if (!isUp && parentId !== currentParentId) {
                         if (parentId === 'root') {
                             parentHistory = [];
                         } else {
                             parentHistory.push(currentParentId);
                         }
                    }
                    currentParentId = parentId;

                    renderFiles(data.files);
                    updateBreadcrumb(data.current_folder);
                    document.getElementById('btnUp').classList.toggle('hidden', currentParentId === 'root');
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-red-500 bg-red-50 rounded-lg mx-4 mt-4">${data.message}</td></tr>`;
                }
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-red-500">加载失败: ${e}</td></tr>`;
            }
        }

        function renderFiles(files) {
            const tbody = document.getElementById('aliFiles');
            if (files.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-12 text-center text-gray-400 flex flex-col items-center"><i class="fas fa-folder-open text-4xl mb-2 opacity-50"></i><span>空文件夹</span></td></tr>';
                return;
            }
            
            tbody.innerHTML = files.map(f => {
                const isFolder = f.type === 'folder';
                const iconClass = isFolder ? 'fa-folder text-yellow-400' : 'fa-file text-blue-400';
                const size = isFolder ? '-' : formatSize(f.size);
                const clickAction = isFolder ? `loadAliFiles('${f.file_id}')` : `browserDownload('${f.file_id}', '${f.name}')`;
                const hoverClass = isFolder ? 'hover:text-blue-600' : 'hover:text-green-600';
                const titleText = isFolder ? '进入文件夹' : '点击下载文件';
                
                return `
                    <tr class="hover:bg-blue-50/50 transition-colors group">
                        <td class="px-4 py-3 whitespace-nowrap">
                            <input type="checkbox" name="aliFile" value="${f.file_id}" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                        </td>
                        <td class="px-4 py-3 whitespace-nowrap">
                            <div class="flex items-center cursor-pointer ${hoverClass}" onclick="${clickAction}" title="${titleText}">
                                <div class="flex-shrink-0 w-8 text-center">
                                    <i class="fas ${iconClass} text-lg"></i>
                                </div>
                                <span class="text-gray-700 font-medium truncate max-w-xs group-hover:underline">${f.name}</span>
                            </div>
                        </td>
                        <td class="px-4 py-3 whitespace-nowrap text-xs text-gray-500 font-mono">${size}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-xs text-gray-400">${f.updated_at.split(' ')[0]}</td>
                    </tr>
                `;
            }).join('');
        }

        function updateBreadcrumb(currentFolder) {
            const el = document.getElementById('currentPath');
            if (!currentFolder || currentFolder.name === 'root') {
                el.innerHTML = '<span class="px-2 py-1 bg-gray-100 rounded text-gray-600">根目录</span>';
            } else {
                el.innerHTML = `<span class="text-gray-400">... / </span> <span class="font-medium text-gray-800">${currentFolder.name}</span>`;
            }
        }

        function browserDownload(fileId, fileName) {
            const url = `/api/aliyun/proxy?file_id=${fileId}&file_name=${encodeURIComponent(fileName)}&drive_id=${currentDriveId || ''}`;
            window.open(url, '_blank');
        }

        function goUp() {
            if (parentHistory.length > 0) {
                const prev = parentHistory.pop();
                loadAliFiles(prev, true);
            } else {
                loadAliFiles('root');
            }
        }

        function toggleAll(source) {
            document.getElementsByName('aliFile').forEach(cb => cb.checked = source.checked);
        }
        
        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function downloadSelected() {
            const checkboxes = document.querySelectorAll('input[name="aliFile"]:checked');
            const ids = Array.from(checkboxes).map(cb => cb.value);
            
            if (ids.length === 0) return alert('请先选择要下载的文件或文件夹');
            if (!confirm(`确定要下载选中的 ${ids.length} 个项目到服务器吗？`)) return;
            
            try {
                const res = await fetch('/api/aliyun/download', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        file_ids: ids,
                        drive_id: currentDriveId
                    })
                });
                const data = await res.json();
                alert(data.message);
                checkboxes.forEach(cb => cb.checked = false);
            } catch (e) {
                alert('下载请求失败');
            }
        }

        async function createFolder() {
            const name = prompt("请输入文件夹名称:");
            if (!name) return;
            
            try {
                const res = await fetch('/api/aliyun/mkdir', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        name: name,
                        parent_file_id: currentParentId,
                        drive_id: currentDriveId
                    })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    // alert('创建成功');
                    loadAliFiles(currentParentId); // 刷新列表
                } else {
                    alert('创建失败: ' + data.message);
                }
            } catch (e) {
                alert('请求失败');
            }
        }

        function triggerUpload() {
            document.getElementById('uploadInput').click();
        }

        async function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('file', file);
            formData.append('parent_file_id', currentParentId);
            if (currentDriveId) formData.append('drive_id', currentDriveId);
            
            // 简单的上传提示，实际项目可以做进度条
            const originalText = document.querySelector('button[onclick="triggerUpload()"]').innerHTML;
            const btn = document.querySelector('button[onclick="triggerUpload()"]');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 上传中...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/aliyun/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                alert(data.message);
                if (data.status === 'success') {
                    loadAliFiles(currentParentId); // 刷新列表 (后台上传可能还没完成，但可以先刷新一下看看)
                }
            } catch (e) {
                alert('上传请求失败');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
                input.value = ''; // 清空，允许再次上传同名文件
            }
        }

        async function deleteSelected() {
            const checkboxes = document.querySelectorAll('input[name="aliFile"]:checked');
            const ids = Array.from(checkboxes).map(cb => cb.value);
            
            if (ids.length === 0) return alert('请先选择要删除的文件或文件夹');
            if (!confirm(`确定要删除选中的 ${ids.length} 个项目吗？(将移入回收站)`)) return;
            
            try {
                const res = await fetch('/api/aliyun/delete', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        file_ids: ids,
                        drive_id: currentDriveId
                    })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    alert(data.message);
                    loadAliFiles(currentParentId); // 刷新列表
                } else {
                    alert('删除失败: ' + data.message);
                }
            } catch (e) {
                alert('请求失败');
            }
        }

        // Search History Management
        const HISTORY_KEY = 'xiaoya_search_history';
        const MAX_HISTORY = 10;

        function loadSearchHistory() {
            try {
                const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
                renderSearchHistory(history);
            } catch (e) {
                console.error('Error loading history:', e);
            }
        }

        function saveSearchHistory(keyword) {
            try {
                let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
                // Remove existing to move to top
                history = history.filter(k => k !== keyword);
                history.unshift(keyword);
                if (history.length > MAX_HISTORY) history.pop();
                localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
                renderSearchHistory(history);
            } catch (e) {
                console.error('Error saving history:', e);
            }
        }

        function renderSearchHistory(history) {
            const container = document.getElementById('search-history');
            const tagsContainer = document.getElementById('history-tags');
            
            if (!history || history.length === 0) {
                container.classList.add('hidden');
                return;
            }
            
            container.classList.remove('hidden');
            tagsContainer.innerHTML = history.map(k => `
                <button onclick="useHistoryKeyword('${k.replace(/'/g, "\\'")}')" 
                        class="px-3 py-1.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-white hover:border-blue-400 hover:text-blue-600 hover:shadow-sm transition-all duration-200">
                    ${k}
                </button>
            `).join('');
        }

        function useHistoryKeyword(keyword) {
            document.getElementById('keyword').value = keyword;
            search();
        }

        function clearHistory() {
            if(confirm('确定清空搜索历史吗？')) {
                localStorage.removeItem(HISTORY_KEY);
                renderSearchHistory([]);
            }
        }

        // Init history
        document.addEventListener('DOMContentLoaded', loadSearchHistory);
    </script>
</body>
</html>
