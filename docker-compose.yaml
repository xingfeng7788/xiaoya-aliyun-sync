services:
  xiaoya-helper:
    build: .
    image: xiaoya-helper:latest
    container_name: xiaoya-helper
    restart: unless-stopped
    ports:
      - "${PORT:-5666}:5666"
    volumes:
      # 数据持久化（数据库、aligo 配置）
      - ./data:/app/data
      # 下载目录（可按需修改宿主机路径）
      - ./downloads:/downloads
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/app/data/xiaoya.db
    # 如果小雅 Alist 也在 Docker 中运行，可使用同一网络直接通信
    # networks:
    #   - xiaoya-net
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5666/login', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

